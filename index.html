<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
    <!-- Цвет строки состояния: разный для светлой и тёмной темы, иначе
         в одной из них шапка выглядит инородной. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#FBF9F4" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#17141F" />

    <!-- Установка на домашний экран: без манифеста приложение открывается
         как сайт, с адресной строкой — это главный признак «не приложения». -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icon-180.png" />

    <!-- iOS не читает манифест: для него нужны отдельные теги. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Bookser" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Телефонные номера в тексте книг не должны превращаться в ссылки. -->
    <meta name="format-detection" content="telephone=no" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet" />
    <title>Bookser — читаем вслух</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
