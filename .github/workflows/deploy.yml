name: Deploy to Firebase

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: firebase-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check & build
        # Firebase web config comes from the committed .env.production
        run: npm run build

      - name: Write & validate service account
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA_JSON" ]; then
            echo "::error::Secret FIREBASE_SERVICE_ACCOUNT is EMPTY or not defined."
            echo "::error::Check the exact name in Settings → Secrets and variables → Actions."
            echo "::error::It must contain the FULL JSON from Firebase Console → Project settings → Service accounts → Generate new private key."
            exit 1
          fi
          printf '%s' "$SA_JSON" > "$RUNNER_TEMP/sa.json"
          node -e '
            const fs = require("fs");
            let j;
            try { j = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/sa.json", "utf8")); }
            catch (e) { console.error("::error::FIREBASE_SERVICE_ACCOUNT is not valid JSON:", e.message); process.exit(1); }
            for (const k of ["type","project_id","private_key","client_email"]) {
              if (!j[k]) { console.error("::error::Service account JSON is missing field:", k, "— paste the COMPLETE file."); process.exit(1); }
            }
            if (j.project_id !== "readai-4f87b") {
              console.error("::error::Service account belongs to project", j.project_id, "— expected readai-4f87b.");
              process.exit(1);
            }
            console.log("✅ Service account OK:", j.client_email);
          '

      - name: Deploy hosting + Firestore rules & indexes
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: |
          npx firebase-tools@13 deploy \
            --only hosting,firestore \
            --project readai-4f87b \
            --non-interactive --force

      - name: Cleanup credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"
