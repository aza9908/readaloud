name: Release Bookser web frontend

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-deploy
  cancel-in-progress: false

jobs:
  publish-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build production web app
        run: npm run build
      - name: Prepare Firebase Hosting credentials
        env:
          SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          umask 077
          node --input-type=module <<'JS'
          import { writeFileSync } from "node:fs";
          const account = JSON.parse(process.env.SERVICE_ACCOUNT);
          if (account.project_id !== "readai-4f87b") throw new Error("Unexpected Firebase project");
          writeFileSync(process.env.RUNNER_TEMP + "/hosting-account.json", JSON.stringify(account), { mode: 0o600 });
          JS
      - name: Release static files to Firebase Hosting
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/hosting-account.json
        run: |
          node --input-type=module <<'JS'
          import { readFileSync, writeFileSync } from "node:fs";
          const { hosting } = JSON.parse(readFileSync("firebase.json", "utf8"));
          writeFileSync("hosting.release.json", JSON.stringify({hosting}));
          JS
          npx --yes firebase-tools@13 deploy --only hosting --config hosting.release.json --project readai-4f87b --non-interactive
      - name: Clean up credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/hosting-account.json"
