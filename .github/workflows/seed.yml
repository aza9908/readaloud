name: Seed books into Firestore

on:
  workflow_dispatch:
    inputs:
      file:
        description: "Seed file to load"
        required: true
        default: "seed/books.full.json"
        type: choice
        options:
          - seed/books.full.json
          - seed/books.sample.json
          - seed/books.exported.json

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Write & validate service account
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA_JSON" ]; then
            echo "::error::Secret FIREBASE_SERVICE_ACCOUNT is empty or not defined."
            exit 1
          fi
          printf '%s' "$SA_JSON" > "$RUNNER_TEMP/sa.json"

      - name: Seed books
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
          GOOGLE_CLOUD_PROJECT: readai-4f87b
        run: npm run seed "${{ inputs.file }}"

      - name: Cleanup credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"
